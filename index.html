
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abdulhalim Muhammad | Senior Software Architect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              main: 'var(--bg-color)',
              sec: 'var(--text-color)',
              thr: '#8b5cf6',   /* Electric Violet — primary accent */
              four: '#22d3ee',  /* Cyan — secondary accent */
              'card-bg': 'var(--card-bg)',
              'muted': 'var(--muted-color)',
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              space: ['Space Grotesk', 'sans-serif'],
            },
            animation: {
              'float': 'float 8s ease-in-out infinite',
              'marquee': 'marquee 40s linear infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translate(0, 0)' },
                '50%': { transform: 'translate(-10px, -20px)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        /* Light Mode — clean soft lavender-white */
        --bg-color: #faf9ff;
        --text-color: #0a0918;
        --card-bg: #f0eeff;
        --muted-color: #8b8aaa;
        --accent: #7c3aed;
        --accent-2: #06b6d4;
        --bg-grid: rgba(124, 58, 237, 0.06);
      }
      .dark {
        /* Aurora Deep Space palette */
        --bg-color: #060612;   /* Deep space navy-black */
        --text-color: #e2e0f5; /* Soft lavender white */
        --card-bg: #0d0d20;    /* Dark card */
        --muted-color: #5a5878; /* Muted violet-gray */
        --accent: #8b5cf6;     /* Electric violet */
        --accent-2: #22d3ee;   /* Cyan highlight */
        --bg-grid: rgba(139, 92, 246, 0.05);
      }
      * {
        cursor: none !important;
        transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s ease, border-color 0.4s ease;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow-x: hidden;
        position: relative;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      /* Premium dot-grid background */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(var(--bg-grid) 1.5px, transparent 1.5px);
        background-size: 32px 32px;
        z-index: -1;
        pointer-events: none;
      }
      /* Ambient nebula glow behind content */
      body::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(ellipse 70% 50% at 15% 60%, rgba(139,92,246,0.07) 0%, transparent 70%),
          radial-gradient(ellipse 50% 40% at 85% 20%, rgba(34,211,238,0.05) 0%, transparent 70%);
        pointer-events: none;
        z-index: -1;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg-color); }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #8b5cf6, #22d3ee);
        border-radius: 10px;
      }

      /* Custom cursor */
      .cursor-dot {
        pointer-events: none;
        position: fixed;
        top: 0; left: 0;
        width: 8px; height: 8px;
        background: linear-gradient(135deg, #8b5cf6, #22d3ee);
        border-radius: 50%;
        z-index: 10000;
        transition: transform 0.04s linear;
        box-shadow: 0 0 10px rgba(139,92,246,0.8);
      }
      .cursor-outline {
        pointer-events: none;
        position: fixed;
        top: 0; left: 0;
        width: 44px; height: 44px;
        border: 1.5px solid rgba(139,92,246,0.6);
        border-radius: 50%;
        z-index: 9999;
        transition: transform 0.12s ease-out, background-color 0.3s ease, width 0.3s ease, height 0.3s ease, border-color 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        color: transparent;
        backdrop-filter: blur(2px);
      }
      .hovered-link .cursor-outline {
        width: 90px; height: 90px;
        background: rgba(139,92,246,0.08);
        border-color: #8b5cf6;
        color: #8b5cf6;
        box-shadow: 0 0 30px rgba(139,92,246,0.3);
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.36.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="selection:bg-thr selection:text-white">
    <div id="root"></div>
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-outline" id="cursor-outline">VIEW</div>
    <script>
      const dot = document.getElementById('cursor-dot');
      const outline = document.getElementById('cursor-outline');
      window.addEventListener('mousemove', (e) => {
        dot.style.transform = `translate(${e.clientX - 5}px, ${e.clientY - 5}px)`;
        outline.style.transform = `translate(${e.clientX - 24}px, ${e.clientY - 24}px)`;
      });
      document.addEventListener('mouseover', (e) => {
        if (e.target.closest('a') || e.target.closest('button') || e.target.closest('.interactive')) {
          document.body.classList.add('hovered-link');
        } else {
          document.body.classList.remove('hovered-link');
        }
      });
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
